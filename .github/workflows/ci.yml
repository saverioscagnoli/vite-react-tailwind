name: CI

on:
  push:
    branches: [master, js]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn build
